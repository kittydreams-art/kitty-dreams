<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitty Dreams - YouTube 頻道</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- 標題區域 -->
    <header>
        <div class="header-content">
            <h1>🐱 Kitty Dreams</h1>
            <p>歡迎來到我的 YouTube 頻道</p>
        </div>
    </header>

    <!-- 主要內容 -->
    <main>
        <div class="container">
            <!-- YouTube 頻道介紹 -->
            <section class="intro">
                <h2>關於我</h2>
                <p>分享日常生活、創意作品和有趣的故事。喜歡我的內容嗎？別忘了訂閱和開啟通知鈴！</p>
                <a href="https://www.youtube.com/channel/YOUR_CHANNEL_ID" target="_blank" class="btn">📺 前往 YouTube 頻道</a>
            </section>

            <!-- 最新影片 -->
            <section class="videos">
                <h2>最新影片</h2>
                <div class="video-grid">
                    <!-- 影片 1 -->
                    <div class="video-card">
                        <div class="video-container">
                            <iframe width="100%" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                        </div>
                        <h3>影片標題 1</h3>
                        <p>簡短描述這個影片的內容...</p>
                    </div>

                    <!-- 影片 2 -->
                    <div class="video-card">
                        <div class="video-container">
                            <iframe width="100%" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                        </div>
                        <h3>影片標題 2</h3>
                        <p>簡短描述這個影片的內容...</p>
                    </div>

                    <!-- 影片 3 -->
                    <div class="video-card">
                        <div class="video-container">
                            <iframe width="100%" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                        </div>
                        <h3>影片標題 3</h3>
                        <p>簡短描述這個影片的內容...</p>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- 頁腳 -->
    <footer>
        <p>&copy; 2026 Kitty Dreams. 保留所有權利。</p>
        <div class="social-links">
            <a href="https://www.youtube.com" target="_blank">YouTube</a>
            <a href="https://www.instagram.com" target="_blank">Instagram</a>
        </div>
    </footer>
</body>
</html>
